[package]
license = "Apache-2.0"
name = "novel-docx"
version = "0.1.0"
edition = "2021"

[dependencies]
novel-storage = { path = "../storage" }
wordcraft-doc = { path = "../../vendor/wordcraft/crates/doc" }
wordcraft-docx = { path = "../../vendor/wordcraft/crates/docx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-bidi = "=0.3.18"

[dev-dependencies]
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }
