[package]
license = "Apache-2.0"
name = "novel-companion"
version = "0.1.0"
edition = "2021"

[dependencies]
novel-storage = { path = "../storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
libc = "=0.2.190"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "form", "rustls"] }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
